{% extends "admin/_base.html" %}
{% block title %}Navigation · Admin{% endblock %}
{% block admin %}
<div class="section-head"><div><div class="eyebrow">Content</div><h2>Top-level navigation</h2></div></div>

<form method="post" class="form form-wide">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="action" value="save">
  <table class="table">
    <thead><tr><th style="width:60px">Order</th><th>Label</th><th>Target</th><th>Visible</th><th>New tab</th><th></th></tr></thead>
    <tbody>
      {% for n in items %}
        <tr>
          <td><input type="hidden" name="id" value="{{ n.id }}"><input class="input" name="order_{{ n.id }}" value="{{ n.display_order }}" style="width:64px;"></td>
          <td><input class="input" name="label_{{ n.id }}" value="{{ n.label }}"></td>
          <td>
            <select class="select" name="target_{{ n.id }}">
              {% for v, lbl in target_choices %}
                <option value="{{ v }}" {% if n.target == v %}selected{% endif %}>{{ lbl }}</option>
              {% endfor %}
              {% if n.target.startswith('url:') %}
                <option value="{{ n.target }}" selected>External — {{ n.target[4:] }}</option>
              {% endif %}
            </select>
          </td>
          <td><input type="checkbox" name="visible_{{ n.id }}" {% if n.visible %}checked{% endif %}></td>
          <td><input type="checkbox" name="new_tab_{{ n.id }}" {% if n.open_in_new_tab %}checked{% endif %}></td>
          <td>
            <button class="btn btn-quiet btn-sm" type="submit" name="action" value="delete" formaction="{{ url_for('admin.nav') }}" formnovalidate
              onclick="this.form.querySelectorAll('input[name=id]').forEach(e=>e.value='');this.previousElementSibling;" >Delete</button>
            {# Simpler: per-row delete form #}
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
  <button class="btn btn-primary" type="submit">Save navigation</button>
</form>

<h3 style="margin-top:36px;">Add a new item</h3>
<form method="post" class="form" style="max-width:680px;">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="action" value="add">
  <div class="row-2">
    <div class="field"><label for="new_label">Label</label>
      <input class="input" id="new_label" name="label" required></div>
    <div class="field"><label for="new_target">Target</label>
      <select class="select" id="new_target" name="target">
        {% for v, lbl in target_choices %}<option value="{{ v }}">{{ lbl }}</option>{% endfor %}
      </select>
    </div>
  </div>
  <label style="display:flex; align-items:center; gap:8px; margin-bottom:14px;">
    <input type="checkbox" name="open_in_new_tab"> Open in a new tab
  </label>
  <button class="btn btn-primary btn-sm" type="submit">Add</button>
</form>

<h3 style="margin-top:36px;">Delete an item</h3>
<form method="post" class="form" style="max-width:480px;">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="action" value="delete">
  <div class="field">
    <select class="select" name="id">
      {% for n in items %}<option value="{{ n.id }}">{{ n.label }} ({{ n.target }})</option>{% endfor %}
    </select>
  </div>
  <button class="btn btn-quiet btn-sm" type="submit">Remove selected</button>
</form>
{% endblock %}
