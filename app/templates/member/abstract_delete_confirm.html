{% extends "base.html" %}
{% block title %}Confirm delete · {{ site.site_name }}{% endblock %}
{% block content %}
<section class="block">
  <div class="container container-narrow" style="text-align: center;">
    <div class="section-head" style="text-align: center;">
      <div><div class="eyebrow">Confirm</div><h2>Delete "{{ a.title }}"</h2></div>
    </div>
    <p class="lede">We emailed a 6-digit code to <strong>{{ current_user.email }}</strong>. Enter it below to permanently delete this abstract.</p>
    <form method="post" class="form" autocomplete="off" style="margin: 28px auto 0;">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="code">Confirmation code</label>
        <input class="input" id="code" name="code" inputmode="numeric" required style="max-width:200px; margin:0 auto;">
      </div>
      <button class="btn btn-primary" type="submit">Delete abstract</button>
    </form>
    <p style="margin-top: 18px;">
      <a class="link" href="{{ url_for('member.dashboard') }}">← back to dashboard</a>
    </p>
  </div>
</section>
{% endblock %}
