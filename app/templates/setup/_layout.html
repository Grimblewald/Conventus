<!doctype html>
<html lang="{{ site.locale or 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>First-run setup · {{ site.site_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
  <style>
    body { background: var(--c-page-bg, #f7f5f1); }
    .setup-shell { max-width: 760px; margin: 48px auto; padding: 0 24px; }
    .setup-card  { background: var(--c-card-bg, #fff); border:1px solid var(--c-card-border, #e4e0d6); border-radius:14px;
                   padding:36px; box-shadow: 0 12px 40px rgba(0,0,0,.06); }
    .setup-eyebrow { font-family: var(--f-ui, system-ui, sans-serif); font-size: 11px;
                     text-transform: uppercase; letter-spacing: .14em; color: var(--c-muted-text, #777); }
    .setup-card h1 { margin: 6px 0 14px; font-family: var(--f-heading, Georgia, serif); }
    .setup-card .lede { color: var(--c-muted-text, #444); }
  </style>
</head>
<body>
<div class="setup-shell">
  <div class="setup-card">
    {% block setup_body %}{% endblock %}
  </div>
</div>
<div class="flash-wrap">
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
  {% endwith %}
</div>
</body>
</html>
