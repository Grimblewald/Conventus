# docker-compose for a small "real" deployment: app + Postgres + Caddy.
# Bring up with:
#
#   docker compose -f deploy/docker-compose.yml up -d
#
# Caddy auto-provisions TLS for the domain in Caddyfile. Skip it if you
# already have a reverse proxy / Cloudflare tunnel handling TLS.

version: "3.9"

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: "postgresql+psycopg://society:${POSTGRES_PASSWORD:?set in .env}@db:5432/society"
      RATELIMIT_STORAGE_URI: "redis://redis:6379/0"
    volumes:
      - ../instance:/app/instance
      - ../uploads:/app/uploads
    depends_on:
      - db
      - redis
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: society
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set in .env}"
      POSTGRES_DB: society
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [app]
    restart: unless-stopped

volumes:
  pgdata:
  caddydata:
  caddyconfig:
