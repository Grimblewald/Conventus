# nginx vhost — terminate TLS here and proxy to gunicorn on 127.0.0.1:5005.
# Use either certbot or pre-issued certs.

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name your-domain.example.org;

    ssl_certificate     /etc/letsencrypt/live/your-domain.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example.org/privkey.pem;

    # Larger than MAX_CONTENT_LENGTH on purpose — Flask should reject first.
    client_max_body_size 20m;

    # Don't override Talisman's headers — but provide sensible defaults if missing.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /static/ {
        alias /opt/society-site/app/static/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:5005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
